name: Atualiza Feed RSS

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instala Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instala dependências
        run: pip install feedparser requests beautifulsoup4

      - name: Gera feed.xml
        run: python generate_feed.py

      - name: Commit e push do feed atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "Atualiza feed RSS [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
